name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pterosync-discord/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Agent tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile bot.py agent_client.py chat_relay.py wings_console.py i18n.py update_agent.py adapters/*.py

      # Clones the panel into .panel (its SDK is not on npm yet), then runs PHPStan and the
      # extension's Pest tests against it in Docker with a MySQL container.
      - name: PHPStan and PHP tests against the panel
        run: python scripts/panel_check.py

      - name: Build the extension
        working-directory: pterosync-discord
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Lint PHP
        run: find pterosync-discord -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 php -l > /dev/null

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_agent_bundle.py pterosync-discord/resources/agent/pterosync-agent.zip
          mkdir -p release
          if [[ "$RELEASE_TAG" == v* ]]; then VERSION="$RELEASE_TAG"; else VERSION="v$(python -c "import json;print(json.load(open('pterosync-discord/extension.json'))['version'])")"; fi
          python scripts/package_extension.py pterosync-discord "release/pterosync-discord-${VERSION}.pteroext" --version "$VERSION"
          cp "release/pterosync-discord-${VERSION}.pteroext" release/pterosync-discord.zip
          cp docker-compose.yml .env.example release/

      - uses: actions/upload-artifact@v4
        with:
          name: pterosync-discord
          path: release/
          if-no-files-found: error

      # Tags publish a release; README links use releases/latest/download/pterosync-discord.zip.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=$([[ "$TAG" =~ (alpha|beta|rc) ]] && echo --prerelease || true)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "PteroSync $TAG" --generate-notes --verify-tag $PRERELEASE
          fi
