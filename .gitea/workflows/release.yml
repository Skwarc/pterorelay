name: Build and publish PteroRelay

on:
  push:
    tags:
      - "v*"

permissions:
  code: read
  releases: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4

      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "22"

      - uses: https://github.com/shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Agent tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile bot.py agent_client.py chat_relay.py wings_console.py i18n.py update_agent.py adapters/*.py

      # The panel SDK is not on npm yet: check out only packages/sdk into .panel.
      - name: Check out the panel SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch 2.0-develop https://github.com/pterodactyl/panel .panel
          git -C .panel sparse-checkout set packages/sdk

      - name: Build the extension
        working-directory: pterorelay-discord
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Lint PHP
        run: find pterorelay-discord -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 php -l > /dev/null

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_agent_bundle.py pterorelay-discord/resources/agent/pterorelay-agent.zip
          mkdir -p release
          if [[ "$RELEASE_TAG" == v* ]]; then VERSION="$RELEASE_TAG"; else VERSION="v$(python -c "import json;print(json.load(open('pterorelay-discord/extension.json'))['version'])")"; fi
          python scripts/package_extension.py pterorelay-discord "release/pterorelay-discord-${VERSION}.pteroext" --version "$VERSION"
          cp "release/pterorelay-discord-${VERSION}.pteroext" release/pterorelay-discord.zip
          cp docker-compose.yml .env.example release/

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@v1.3.7
        with:
          name: PteroRelay ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            Install `pterorelay-discord.zip` (or the versioned `.pteroext`) in **Admin → Extensions**,
            or on the panel host: `php artisan p:extension:install pterorelay-discord.zip --enable`.
            Then deploy the agent from **Admin → PteroRelay → Run the agent on this panel**.
          files: |
            release/*.pteroext
            release/*.sha256
            release/pterorelay-discord.zip
            release/docker-compose.yml
            release/.env.example
